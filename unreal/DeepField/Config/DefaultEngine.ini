[OnlineServices.Lobbies]
; WS-11 (C14): the Deep Field lobby schema. The engine hard-codes LobbyBase as the lobby base schema
; (LobbiesCommonTypes.cpp) and only a base schema may carry Searchable attributes (Schema.cpp), so the
; search keys are appended to LobbyBase's categories the way the engine's own recipe does
; (LobbiesCommonTests.cpp: clear the array, re-declare LobbyBase with the extra ids) and the rest of
; the session data lives on the derived DFLobby. The join-code flow searches DFJoinCode.
!SchemaCategoryAttributeDescriptors=ClearArray
