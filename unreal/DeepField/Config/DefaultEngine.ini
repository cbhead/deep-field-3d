+SchemaCategoryAttributeDescriptors=(SchemaId="DFLobby", CategoryId="LobbyMember", AttributeIds=("DFName"))
+SchemaAttributeDescriptors=(Id="DFMap", Type="String", Flags=("Public", "Searchable"), MaxSize=64)
+SchemaAttributeDescriptors=(Id="DFTier", Type="String", Flags=("Public", "Searchable"), MaxSize=64)
+SchemaAttributeDescriptors=(Id="DFEndless", Type="Bool", Flags=("Public", "Searchable"))
+SchemaAttributeDescriptors=(Id="DFBuild", Type="String", Flags=("Public", "Searchable"), MaxSize=64)
