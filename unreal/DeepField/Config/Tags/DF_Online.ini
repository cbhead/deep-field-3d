; WS-11-owned local tags (append-only). The connection screen state machine (C14) as tags so
; DF.Message.ConnectionState carries one; the enum EDFConnectionState mirrors this list.
; NOTE (INT, 2026-09-21): the rows below use the PLAIN key, not `+GameplayTagList=`. A loose tag
; source under Config/Tags/ is read by UGameplayTagsManager with
; `SourceTagList->LoadConfig(UGameplayTagsList::StaticClass(), *IniFilePath)` on that one file
; (GameplayTagsManager.cpp:582) — it is not part of the Default*.ini hierarchy, so the `+` combination
; prefix that belongs in DefaultGameplayTags.ini does not apply here. WS-02 found this the hard way:
; its own ini carried 47 rows in the `+` form, none of them registered, every GameplayCue.DF.* leaf was
; an invalid tag, and FireCue returned early on !Cue.IsValid() — so no status or reaction cue had ever
; run, silently. This file had the identical bug. Keep the plain key when appending.
[/Script/GameplayTags.GameplayTagsList]
