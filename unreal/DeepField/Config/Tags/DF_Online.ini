GameplayTagList=(Tag="DF.Online.Connection.LoggingIn",DevComment="Auth in flight")
GameplayTagList=(Tag="DF.Online.Connection.LoggedIn",DevComment="Identity known, no session")
GameplayTagList=(Tag="DF.Online.Connection.Hosting",DevComment="Local player owns the party lobby")
GameplayTagList=(Tag="DF.Online.Connection.Joining",DevComment="Searching / joining a lobby, waiting for approval")
GameplayTagList=(Tag="DF.Online.Connection.Connected",DevComment="Travelling to / in the host's match")
