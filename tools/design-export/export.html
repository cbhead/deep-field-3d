<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deep Field 3D — asset pack export (headless host)</title>
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "/vendor/three/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "/vendor/three/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "/vendor/three/examples/jsm/exporters/GLTFExporter.js",
    "three/addons/loaders/GLTFLoader.js": "/vendor/three/examples/jsm/loaders/GLTFLoader.js"
  }
}
</script>
<style>
  html,body{margin:0;height:100%;background:#0D1119;color:#c3ccd8;font:13px/1.5 monospace}
  body{display:grid;grid-template-columns:1fr var(--aside,320px);grid-template-rows:1fr auto;height:100%}
  body.wide{--aside:0px}
  three-d-stage{width:100%;height:100%;display:block;min-height:320px;grid-column:1;grid-row:1}
  three-d-stage:not(:defined){visibility:hidden}
  #files{grid-column:2;grid-row:1;border-left:1px solid #333;display:flex;flex-direction:column;overflow:hidden}
  body.wide #files{display:none}
  #files header{padding:6px 34px 6px 8px;border-bottom:1px solid #333;display:flex;gap:6px;align-items:center}
  #files header b{font-weight:600;color:#e6edf5}
  #filter{flex:1;min-width:0;background:#161b26;border:1px solid #333;color:inherit;font:inherit;padding:3px 6px;border-radius:3px}
  #filter:focus{outline:1px solid #4a6a9a}
  #toggle{position:fixed;top:6px;right:8px;z-index:5;background:#161b26;border:1px solid #333;color:inherit;font:inherit;cursor:pointer;padding:3px 7px;border-radius:3px;opacity:.85}
  #toggle:hover{opacity:1}
  #list{overflow:auto;flex:1;padding-bottom:12px}
  #list .grp{position:sticky;top:0;background:#0D1119;color:#7e8b9e;padding:5px 8px 2px;border-bottom:1px solid #222}
  #list a{display:flex;gap:8px;padding:2px 8px;color:inherit;text-decoration:none;cursor:pointer;white-space:nowrap}
  /* an explicit display beats the UA's [hidden] rule, so the filter needs this */
  #list a[hidden],#list .grp[hidden]{display:none}
  #list a:hover{background:#182030}
  #list a.on{background:#23324a;color:#fff}
  #list a.empty span.n{color:#6b7686}
  #list a span.n{flex:1;overflow:hidden;text-overflow:ellipsis}
  #list a span.t{color:#7e8b9e;font-size:11px}
  #status{grid-column:1/-1;grid-row:2;padding:8px 12px;border-top:1px solid #333;white-space:pre-wrap;max-height:30vh;overflow:auto}
</style>
</head>
<body>
<three-d-stage name="deepfield_tower_pack" background="#0D1119"></three-d-stage>
<button id="toggle" title="hide the index">›</button>
<aside id="files">
  <header>
    <b id="count">0</b>
    <input id="filter" placeholder="filter…" autocomplete="off" spellcheck="false">
  </header>
  <div id="list"></div>
</aside>
<pre id="status">Loading models…</pre>
<script src="./three-d-stage.js"></script>
<script type="module">
/* The same export as docs/design/"Deep Field 3D - Asset Export.html" — the page Claude Design ships — with two
   changes: every file is PUT to tools/design-export/server.mjs at /out/<repo path> instead of being zipped for
   download, and the run starts on load. The build / prune / bake logic is verbatim; when design's page changes,
   port the change here. Served at http://127.0.0.1:8765/export.html by tools/design-export.sh.

   Ported 2026-09-12 from the drop of the same day: per-item manifest fields (run/repeat/width, arcDeg/radius,
   budgetTris/budgetParts, instanced, lod1/lodSwitch, the vehicle block), all four variants of a tile that has
   them, one file per hand pose from the item's own `poses` list, and the five reload props lifted out of the
   weapon viewmodels. */
const post = (s) => fetch('/log', { method: 'POST', body: s }).catch(() => {});

/* Every file this run wrote, listed beside the viewer and clickable. The page
   used to show one frozen Lance — `stage.setObject` was called once, before the
   loop, and `add()` never touched the stage again — so a run that wrote five
   hundred models looked identical to one that wrote nothing, and there was no
   way to see any of them without digging through game/assets/ by hand.
   Clicking a row loads that .glb back off disk through the host's GET /out/,
   which also proves the file is really there and really parses. */
const EXPORTED = [];
const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
const filterEl = document.getElementById('filter');
let lastGroup = null, currentRow = null;

const addRow = (rec) => {
  const folder = rec.path.split('/').slice(0, -1).join('/');
  if (folder !== lastGroup) {
    lastGroup = folder;
    const h = document.createElement('div');
    h.className = 'grp';
    h.textContent = folder.replace(/^game\/assets\//, '');
    listEl.append(h);
  }
  const a = document.createElement('a');
  a.className = rec.parts ? '' : 'empty';
  a.title = `${rec.path} · ${rec.bytes.toLocaleString()} bytes · ${rec.parts} part(s)`;
  a.innerHTML = '<span class="n"></span><span class="t"></span>';
  a.querySelector('.n').textContent = rec.name.replace(/\.glb$/, '');
  a.querySelector('.t').textContent = rec.parts ? `${rec.tris}▲` : 'empty';
  a.onclick = () => show(rec, a);
  rec.el = a;
  listEl.append(a);
  countEl.textContent = EXPORTED.length;
};

filterEl.oninput = () => {
  const q = filterEl.value.trim().toLowerCase();
  for (const rec of EXPORTED) if (rec.el) rec.el.hidden = q && !rec.name.toLowerCase().includes(q);
  for (const h of listEl.querySelectorAll('.grp')) {
    let n = h.nextElementSibling, any = false;
    while (n && !n.classList.contains('grp')) { if (!n.hidden) any = true; n = n.nextElementSibling; }
    h.hidden = !any;
  }
};

document.getElementById('toggle').onclick = (e) => {
  const hidden = document.body.classList.toggle('wide');
  e.target.textContent = hidden ? '‹' : '›';
  e.target.title = hidden ? 'show the index' : 'hide the index';
};
const status = document.getElementById('status');
const say = (s) => { status.textContent = s; post(s); };
window.addEventListener('error', (e) => say('ERROR ' + (e.error?.stack || e.message)));
window.addEventListener('unhandledrejection', (e) => say('ERROR ' + (e.reason?.stack || e.reason)));

import { applyLevels, triCount, countMeshes } from './models/tower-kit.js';
import { makeEnemyKit, ENEMIES } from './models/enemies.js';
import { TRAPS } from './models/traps.js';
import { PROJECTILES } from './models/projectiles.js';
import { makeWeaponKit, WEAPONS, ATTACHMENTS, AMMO, TRACERS } from './models/weapons.js';
import { makeHeroKit, HEROES } from './models/heroes.js';
import { FOUNDRY, makeFoundryMats } from './models/foundry.js';
import { SHARED, PICKUPS } from './models/shared.js';
import { SWITCHYARD, makeSwitchyardMats } from './models/switchyard.js';
// The Spire's kit has been written since M3 and never built: this page
// imported three map modules and stopped, so every spire_ name in the game
// resolves to nothing and that map is forty metres of untinted boxes.
import { SPIRE, makeSpireMats } from './models/spire.js';
import { TOASTER, makeToasterMats } from './models/toaster.js';
import { VEHICLES, makeVehicleMats } from './models/vehicles.js';
import { VFX, makeVfxMats } from './models/vfx.js';
const MODS = ['lance', 'nova', 'singularity', 'skywatch', 'arc', 'barricade', 'filament', 'detector', 'overclock'];
const ICONS = [
  'icon_tower_lance', 'icon_tower_nova', 'icon_tower_arc', 'icon_tower_singularity', 'icon_tower_skywatch', 'icon_tower_barricade', 'icon_tower_detector', 'icon_tower_filament', 'icon_tower_overclock',
  'icon_trap_spike', 'icon_trap_tar', 'icon_trap_launcher',
  'icon_enemy_drifter', 'icon_enemy_mote', 'icon_enemy_monolith', 'icon_enemy_skiff', 'icon_enemy_aegis', 'icon_enemy_warden', 'icon_enemy_mole', 'icon_enemy_cluster',
  'icon_status_burn', 'icon_status_chill', 'icon_status_mark', 'icon_status_shock', 'icon_status_freeze', 'icon_status_shred', 'icon_reaction_thermalshock', 'icon_reaction_flashfreeze',
  'icon_scrap_alloy', 'icon_scrap_flux', 'icon_scrap_plating', 'icon_scrap_gravium',
  'icon_weapon_sidearm', 'icon_weapon_rifle', 'icon_weapon_scattergun', 'icon_weapon_emberpistol', 'icon_weapon_wrench',
  'icon_ammo_standard', 'icon_ammo_ap', 'icon_ammo_hollowpoint', 'icon_ammo_incendiary', 'icon_ammo_cryo',
  'icon_attach_longbarrel', 'icon_attach_shortbarrel', 'icon_attach_compensator', 'icon_attach_rangefinder', 'icon_attach_drumfeed', 'icon_attach_bracestock', 'icon_attach_stabilizer', 'icon_attach_embercoil', 'icon_attach_cryocell', 'icon_attach_voltcap',
  'icon_faction_forge', 'icon_faction_ember', 'icon_faction_tempest', 'icon_faction_glacier', 'icon_faction_specter', 'icon_ability_overdrive', 'icon_ability_ignitionwave', 'icon_ability_chainsurge', 'icon_ability_cryofield', 'icon_ability_revealpulse',
  'icon_path_damage', 'icon_path_range', 'icon_path_rate'];
const EXTRA = [
  { dir: 'enemies/', items: ENEMIES, kind: 'enemy' }, { dir: 'traps/', items: TRAPS, kind: 'trap' }, { dir: 'towers/', items: PROJECTILES, kind: 'projectile' },
  { dir: 'weapons/', items: WEAPONS, kind: 'weapon' }, { dir: 'weapons/', items: WEAPONS.filter((w) => w.worldFile).map((w) => ({ ...w, file: w.worldFile, id: w.id + '_world', baseId: w.id })), kind: 'weapon_world' },
  { dir: 'heroes/', items: HEROES, kind: 'hero' }, { dir: 'maps/foundry/', items: FOUNDRY, kind: 'map_foundry' }, { dir: 'maps/switchyard/', items: SWITCHYARD, kind: 'map_switchyard' }, { dir: 'maps/spire/', items: SPIRE, kind: 'map_spire' }, { dir: 'maps/toaster/', items: TOASTER, kind: 'map_toaster' }, { dir: 'vehicles/', items: VEHICLES, kind: 'vehicle' }, { dir: 'shared/', items: SHARED, kind: 'shared' }, { dir: 'vfx/', items: VFX, kind: 'vfx' }, { dir: 'economy/', items: PICKUPS, kind: 'pickup' }, { dir: 'weapons/', items: ATTACHMENTS, kind: 'attachment' }, { dir: 'weapons/', items: AMMO, kind: 'ammo' }, { dir: 'weapons/', items: TRACERS, kind: 'tracer' }];
/* Reload props (FORWARD-MANIFEST-reload Ask A). Not new geometry: the feed part
   already in each viewmodel, lifted out and exported on its own so a reload can
   put one in the air as the spent mag and another in the off-hand as the fresh
   one. Lifting it out is only correct because the part's pivot now sits on the
   seated face (Ask C) — dropping it is a translation and a tip, not a swing
   about the weapon origin.

   The Scattergun is tube-fed, so its reload is shells through the loading port
   and its prop is a LOADED hull, not a magazine. It ships under both the
   requested name and the honest one; `_shell` is the one to keep. */
const RELOAD_PROPS = [
  ['sidearm', 'sidearm_magazine', 'weapon_sidearm_magazine.glb', 'Detachable box magazine exported on its own — the same node as `sidearm_magazine` in the viewmodel, origin on the seated top face, +Y up. Dropping it is a translate down plus a tip about X; `userData.drop` on the source group carries both axes.'],
  ['rifle', 'rifle_magazine', 'weapon_rifle_magazine.glb', 'STANAG magazine on its own, origin on the magwell mouth plane (1.9 mm forward of the well centre, where the 25 mm curve crosses it). Feed lips and top round included — they are visible for the half second it is in the air.'],
  ['emberpistol', 'emberpistol_magazine', 'weapon_emberpistol_magazine.glb', 'Fuel canister, not a magazine — the vessel is what this gun reloads, so it now carries the armoury’s `_magazine` name and exports under it. Origin on the forward dome, the face that meets the regulator; it pulls off rearward, so `userData.drop` is +Z rather than −Y.'],
  ['scattergun', 'scattergun_shell', 'weapon_scattergun_magazine.glb', 'A loaded 12-gauge hull under the requested filename so nothing falls back to a placeholder. This gun has no detachable magazine; see `weapon_scattergun_shell.glb`, which is the same file under the name that tells the truth.'],
  ['scattergun', 'scattergun_shell', 'weapon_scattergun_shell.glb', 'Loaded 12-gauge hull: brass head with rim and extractor groove, full-length body, folded six-point crimp cut into the dome as ridges. Origin at the rim face so a reload pushes it in along +Z at `scattergun_mount_loadport`. Distinct from `scattergun_case`, which is fired — open mouth, no crimp.'],
];
const ROUTES = [['enemy_', 'enemies'], ['boss_', 'enemies'], ['tower_', 'structures'], ['trap_', 'structures'], ['socket_', 'structures'], ['weapon_', 'weapons'], ['attach_', 'weapons'], ['ammo_', 'weapons'], ['hands_', 'weapons'], ['hero_', 'heroes'], ['proj_', 'vfx'], ['vfx_', 'vfx'], ['pickup_', 'economy'], ['foundry_', 'maps'], ['switchyard_', 'maps'], ['spire_', 'maps'], ['toaster_', 'maps'], ['vehicle_', 'vehicles'], ['shared_', 'maps'], ['prop_', 'maps'], ['ui_', 'ui']];
const routeFor = (file) => 'game/assets/' + (ROUTES.find(([p]) => file.startsWith(p))?.[1] || 'misc') + '/' + file;
const TOWERS = (await Promise.all(MODS.map((m) => import(`./models/${m}.js`)))).map((m) => m.TOWER);

const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const kit = makeEnemyKit(THREE);
Object.assign(kit.mats, makeWeaponKit(THREE).mats, makeHeroKit(THREE).mats); makeFoundryMats(THREE, kit.mats); makeSwitchyardMats(THREE, kit.mats); makeSpireMats(THREE, kit.mats); makeToasterMats(THREE, kit.mats); makeVehicleMats(THREE, kit.mats); makeVfxMats(THREE, kit.mats); kit.mats.threat = kit.mats.weak;
const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
const exporter = new GLTFExporter();

const allLevels = (t, fn) => Object.fromEntries(t.paths.map((p) => [p.id, fn(p.id)]));
const resetVis = (m) => m.traverse((o) => { o.visible = !o.userData.gizmo; });
function visBox(root) {
  root.updateMatrixWorld(true);
  const b = new THREE.Box3(), tmp = new THREE.Box3();
  root.traverse((o) => {
    if (!o.isMesh) return;
    for (let p = o; p; p = p.parent) if (!p.visible) return;
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    tmp.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld);
    b.union(tmp);
  });
  return b;
}
function pruneToPath(model, id, path) {
  // The `$` used to close this pattern, which dropped every increment a tower
  // names per part rather than as one group: the Singularity mirrors its
  // per-arm copies onto <id>_up_<path>_l<N>_arm<i> (singularity.js cue()), so
  // six of its twenty range/rate stages exported identical to the stage below
  // them — an upgrade you bought and could not see. Match the level, then a
  // boundary: a suffixed child belongs to the same increment.
  const re = new RegExp(`^${id}_up_${path}_l\\d+(?:_|$)`);
  const keep = (o, under) => {
    if (!o.visible && o !== model) return false;
    const u = under || re.test(o.name);
    if (o.isMesh) { o.visible = o.visible && u; return o.visible; }
    let any = false;
    for (const c of o.children) any = keep(c, u) || any;
    o.visible = any || o === model;
    return any;
  };
  keep(model, false);
}
function chassis(t, variant) {
  const m = t.build(kit, allLevels(t, () => 1));
  applyLevels(m, t, allLevels(t, () => 1));
  if (variant) t.variants[variant](m, kit);
  m.rotation.y = Math.PI;
  return m;
}
/** What each contributes to the progress total: a tower is a chassis plus ten
 *  stages per path (the barricade is three states); an item is its build, plus
 *  three more if it has variants, plus one per extra pose. */
const towerFileCount = (t) => (t.id === 'barricade' ? 3 : 1 + t.paths.length * 10);
const itemFileCount = (it) => (it.buildVariant ? 4 : 1) + (it.poses ? it.poses.length - 1 : 0);
stage.setObject(chassis(TOWERS[0]));

const glb = async (obj) => new Uint8Array(await exporter.parseAsync(obj, { binary: true, trs: true, onlyVisible: true }));
async function bakeSky(mesh, faceSize = 1536, W = 4096) {
  const renderer = stage._renderer, H = W / 2;
  const cubeRT = new THREE.WebGLCubeRenderTarget(faceSize, { generateMipmaps: false }); cubeRT.texture.colorSpace = THREE.SRGBColorSpace;
  const cubeCam = new THREE.CubeCamera(1, 5000, cubeRT);
  const sc = new THREE.Scene(); const sky = new THREE.Mesh(mesh.geometry, mesh.material); sky.frustumCulled = false; sc.add(sky); sc.add(cubeCam);
  cubeCam.update(renderer, sc);
  const eqRT = new THREE.WebGLRenderTarget(W, H, { depthBuffer: false }); eqRT.texture.colorSpace = THREE.SRGBColorSpace;
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
    uniforms: { tCube: { value: cubeRT.texture } }, depthTest: false, depthWrite: false,
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
    fragmentShader: 'precision highp float; uniform samplerCube tCube; varying vec2 vUv; void main(){ float ph = vUv.x * 6.28318530718, th = (1. - vUv.y) * 3.14159265359; vec3 d = vec3(-cos(ph) * sin(th), cos(th), sin(ph) * sin(th)); gl_FragColor = textureCube(tCube, d); }' }));
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), qs = new THREE.Scene(); qs.add(quad);
  const prevRT = renderer.getRenderTarget(); renderer.setRenderTarget(eqRT); renderer.render(qs, cam);
  const px = new Uint8Array(W * H * 4); renderer.readRenderTargetPixels(eqRT, 0, 0, W, H, px); renderer.setRenderTarget(prevRT);
  const c = document.createElement('canvas'); c.width = W; c.height = H; const ctx = c.getContext('2d'), img = ctx.createImageData(W, H);
  for (let y = 0; y < H; y++) img.data.set(px.subarray((H - 1 - y) * W * 4, (H - y) * W * 4), y * W * 4);
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false, toneMapped: false }); mat.name = mesh.material.name + '_baked';
  cubeRT.dispose(); eqRT.dispose(); quad.geometry.dispose(); quad.material.dispose();
  const baked = new THREE.Mesh(mesh.geometry, mat); baked.name = mesh.name; baked.userData = { ...mesh.userData, gizmo: false, bakedEquirect: `${W}x${H} png` };
  return baked;
}
async function bakeSkies(obj) {
  if (obj.isMesh && obj.material?.isShaderMaterial && obj.userData.sky) return bakeSky(obj);
  const jobs = [];
  obj.traverse((o) => { if (o.isMesh && o.material?.isShaderMaterial && o.userData.sky && o.parent) jobs.push(o); });
  for (const o of jobs) { const b = await bakeSky(o); b.position.copy(o.position); b.rotation.copy(o.rotation); b.scale.copy(o.scale); o.parent.add(b); o.parent.remove(o); }
  return obj;
}
const tick = () => new Promise((r) => setTimeout(r, 0));
const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
const loader = new GLTFLoader();
let lastShown = 0;

/** Put an object on the stage and mark its row, without disturbing the export. */
function preview(obj, rec) {
  try { stage.setObject(obj); } catch { return; }
  if (currentRow) currentRow.classList.remove('on');
  currentRow = rec?.el || null;
  if (currentRow) {
    currentRow.classList.add('on');
    currentRow.scrollIntoView({ block: 'nearest' });
  }
}

/** Load an exported file back off disk and show it. The host serves the repo at
 *  GET /out/, so this reads the actual bytes that were written. */
async function show(rec, el) {
  try {
    const res = await fetch('/out/' + rec.path);
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    const gltf = await loader.parseAsync(await res.arrayBuffer(), '');
    preview(gltf.scene, { el });
    say(`${rec.path} · ${rec.bytes.toLocaleString()} bytes · ${rec.parts} part(s) · ${rec.tris} tris`);
  } catch (err) {
    say(`could not open ${rec.path}: ${err.message}`);
  }
}
const bounds = (o) => { const b = visBox(o); return b.isEmpty() ? null : { min: b.min.toArray().map((v) => +v.toFixed(3)), max: b.max.toArray().map((v) => +v.toFixed(3)) }; };
const text = async (p) => { const r = await fetch(p); if (!r.ok) throw new Error(`fetch ${p}: ${r.status}`); return new Uint8Array(await r.arrayBuffer()); };
const readJson = async (p) => { const r = await fetch(p); return r.ok ? r.json() : null; };
const put = async (name, data) => {
  const r = await fetch('/out/' + name, { method: 'PUT', body: data });
  if (!r.ok) throw new Error(`PUT ${name}: ${r.status}`);
};

/* The delivery note is design's to rewrite, but the repo appends its own "Integration record"
   section — what actually landed on the code side — and a full run used to overwrite the file and
   delete it. It already ate the 2026-09-07 record once. Carry every record across onto the fresh
   note instead. (A zip drop unpacked by hand still clobbers it; only this path can protect it.) */
const putDeliveryNote = async (srcPath, destPath) => {
  const fresh = new TextDecoder().decode(await text(srcPath)).replace(/\s*$/, '');
  const res = await fetch('/out/' + destPath);
  const prev = res.ok ? await res.text() : '';
  const at = prev.search(/^## Integration record/m);
  const keep = at < 0 || /^## Integration record/m.test(fresh) ? '' : prev.slice(at).replace(/\s*$/, '');
  const out = keep ? `${fresh}\n\n---\n\n${keep}\n` : `${fresh}\n`;
  await put(destPath, new TextEncoder().encode(out));
};

/* `?only=<sel>[,<sel>…]` rebuilds part of the drop instead of all of it, so a tweak to one model
   costs one export rather than five hundred. A selector is a tower id (`lance` — its chassis and
   thirty stage modules), a category (`vfx`, `enemy`, `map_toaster`, `vehicle` — everything one
   source module builds), or an item id or file stem (`drifter`, `enemy_drifter`, `rifle` for the
   viewmodel and the world gun alike, `hands` for a hand set and every pose it ships).
   A selector matching nothing is an error: a silent empty run looks just like a successful one. */
const ONLY = (new URLSearchParams(location.search).get('only') || '').split(',').map((s) => s.trim()).filter(Boolean);
const PARTIAL = ONLY.length > 0;
const stemOf = (file) => file.split('/').pop().replace(/\.glb$/, '');
const matchedSel = new Set();
const wanted = (...keys) => {
  if (!PARTIAL) return true;
  let hit = false;
  for (const s of ONLY) if (keys.includes(s)) { matchedSel.add(s); hit = true; }
  return hit;
};
const TOWERS_SEL = TOWERS.filter((t) => wanted(t.id, `tower_${t.id}`));
const EXTRA_SEL = EXTRA.map((c) => ({ ...c, items: c.items.filter((it) => wanted(c.kind, it.id, it.baseId, stemOf(it.file))) })).filter((c) => c.items.length);
const RELOAD_SEL = RELOAD_PROPS.filter(([wid, , file]) => wanted('weapon_reload', wid, stemOf(file)));
const TOTAL = TOWERS_SEL.reduce((a, t) => a + towerFileCount(t), 0)
  + EXTRA_SEL.reduce((a, c) => a + c.items.reduce((n, it) => n + itemFileCount(it), 0), 0)
  + RELOAD_SEL.length;
say(`Ready — ${TOTAL} GLB file${TOTAL === 1 ? '' : 's'}${PARTIAL ? ` (only: ${ONLY.join(', ')})` : ''}; starting`);
const manifest = { version: '1.0', generated: new Date().toISOString(), units: 'metres', up: '+Y', forward: '-Z', files: [] };
let done = 0;
const add = async (name, obj, meta) => {
  obj.name = name.split('/').pop().replace(/\.glb$/, '');
  obj = await bakeSkies(obj);
  const data = await glb(obj);
  const route = routeFor(name);
  await put(route, data);
  const tris = triCount(obj), parts = countMeshes(obj);
  manifest.files.push({ file: name, bytes: data.length, tris, parts, bounds: bounds(obj), ...meta });
  const rec = { name: name.split('/').pop(), path: route, bytes: data.length, tris, parts };
  EXPORTED.push(rec);
  addRow(rec);
  // A frozen preview says nothing about whether the run is working. Showing the
  // model being written does, and throttling keeps it from thrashing the GPU on
  // a run that writes a file every forty milliseconds.
  if (parts && performance.now() - lastShown > 120) { lastShown = performance.now(); preview(obj, rec); }
  done++;
  say(`${done} / ${TOTAL} · ${name} · ${data.length} bytes`);
  await tick();
};
try {
  const unmatched = ONLY.filter((s) => !matchedSel.has(s));
  if (unmatched.length) throw new Error(`--only matched nothing: ${unmatched.join(', ')}`);
  for (const t of TOWERS_SEL) {
    const rigMeta = t.rig ? { rig: { yaw: t.id + '_yaw', pitch: t.id + '_pitch', muzzle: t.id + '_muzzle', yawLimits: t.rig.yaw, pitchLimits: t.rig.pitch, traverseDegPerSec: t.rig.traverse, elevateDegPerSec: t.rig.elevate, pitchSign: -1 } } : { spin: t.id + '_spin' };
    if (t.id === 'barricade') {
      for (const [file, v] of [['tower_barricade.glb', null], ['tower_barricade_damaged.glb', 'damaged'], ['tower_barricade_broken.glb', 'broken']])
        await add(file, chassis(t, v), { tower: t.id, kind: 'structure', state: v || 'intact' });
      continue;
    }
    await add(`tower_${t.id}_chassis.glb`, chassis(t), { tower: t.id, kind: 'chassis', ...rigMeta, cues: t.paths.map((p) => p.cue), energy: t.swatch });
    const staged = t.build(kit, allLevels(t, () => 10));
    staged.rotation.y = Math.PI;
    for (const p of t.paths) for (let s = 1; s <= 10; s++) {
      resetVis(staged);
      applyLevels(staged, t, allLevels(t, (id) => id === p.id ? s : 1));
      pruneToPath(staged, t.id, p.id);
      await add(`tower_${t.id}_${p.id}_s${s}.glb`, staged, { tower: t.id, kind: 'module', path: p.id, stage: s, breakpoint: [4, 7, 10].includes(s), adds: p.steps[s] || null, increments: Array.from({ length: s - 1 }, (_, i) => `${t.id}_up_${p.id}_l${i + 2}`) });
    }
  }
  for (const c of EXTRA_SEL) for (const it of c.items) {
    const m = it.build(kit);
    /* Linear modules carry their run axis, repeat length and width
       (FORWARD-MANIFEST-switchyard, "Conventions we need stated on
       delivery"). Neither `run` nor `repeat` is recoverable from the mesh,
       and a cut channel placed with a +Z helper when it runs +X cost a
       whole review pass — perfectly plausible art, placed perfectly wrongly. */
    const lin = it.run ? { run: it.run, repeat: it.repeat, width: it.width } : null;
    /* An arc is a linear module whose axis is a radius: `arcDeg`, `radius`
       and `width`, with the origin at the CENTRE OF CURVATURE. Budgets ship
       beside the measured counts so `make assets` can fail on a file that is
       over, instead of the cost turning up as a frame rate three weeks later;
       `instanced` marks the files meant for the multimesh path; `lod1` /
       `lodSwitch` tie a tree to its billboard (FORWARD-MANIFEST-toaster,
       "Conventions we need stated on delivery", items 1–4). */
    const arc = it.arcDeg ? { arcDeg: it.arcDeg, radius: it.radius, width: it.width } : null;
    const budget = it.budgetTris ? { budgetTris: it.budgetTris, budgetParts: it.budgetParts } : null;
    const inst = it.instanced ? { instanced: true } : null;
    const lod = it.lod1 ? { lod1: it.lod1, lodSwitch: it.lodSwitch } : null;
    const veh = m.userData && m.userData.vehicle ? { vehicle: m.userData.vehicle } : null;
    await add(it.file, m, { kind: c.kind, id: it.id, note: it.note, ...lin, ...arc, ...budget, ...inst, ...lod, ...veh });
    // A tile with variants ships all four. The exporter called build() only,
    // so v0 was the sole GLB and one tile laid twenty-four times put the same
    // puddle on a lattice — and the switch stand in v1 was never delivered at
    // all (design-system README, “ships one variant of four”).
    if (it.buildVariant) for (let v = 1; v <= 3; v++)
      await add(it.file.replace(/\.glb$/, `_v${v}.glb`), it.buildVariant(kit, v), { kind: c.kind, id: `${it.id}_v${v}`, variant: v, note: it.note, ...lin, ...arc, ...budget, ...inst });
    /* Hand sets ship one file per pose. poses[0] is the base build above; the
       rest are the pistol and tool grips the viewmodel picks by platform, and
       the three reload poses, which carry the OFF-HAND ALONE — the firing hand
       never leaves the grip during a reload, so one set of three serves every
       platform instead of one set per platform. */
    if (it.poses) for (const p of it.poses.slice(1)) {
      kit.__handsPose = p;
      const pm = it.build(kit);
      kit.__handsPose = null;
      await add(it.file.replace(/\.glb$/, `_${p}.glb`), pm, { kind: c.kind, id: `${it.id}_${p}`, pose: p, offhandOnly: ['magout', 'magin', 'charge'].includes(p) || undefined, note: it.note });
    }
  }
  for (const [wid, node, file, note] of RELOAD_SEL) {
    const src = WEAPONS.find((x) => x.id === wid).build(kit);
    const n = src.getObjectByName(node);
    if (!n) { say(`WARN reload prop node missing: ${node}`); continue; }
    n.parent.remove(n);
    n.position.set(0, 0, 0); n.rotation.set(0, 0, 0);
    n.traverse((o) => { o.visible = true; });
    await add(file, n, { kind: 'weapon_reload', id: file.replace(/\.glb$/, ''), weapon: wid, source: node, note });
  }
  /* A filtered run rewrites only the rows it rebuilt, in place. Replacing the file outright would
     strip every row for a model this run did not build — including the rig limits and slew rates
     TowerRig reads back for each chassis, which would quietly reset every tower to its defaults.
     Existing order is kept so the diff shows what changed rather than the whole file. */
  if (PARTIAL) {
    const prev = await readJson('/out/game/assets/structures/manifest.json');
    if (prev?.files?.length) {
      const mine = new Map(manifest.files.map((f) => [f.file, f]));
      const had = new Set(prev.files.map((f) => f.file));
      manifest.files = [...prev.files.map((f) => mine.get(f.file) ?? f), ...manifest.files.filter((f) => !had.has(f.file))];
    }
  }
  say('Writing manifest…');
  await put('game/assets/structures/manifest.json', new TextEncoder().encode(JSON.stringify(manifest, null, 2)));

  if (!PARTIAL) {
  say('Bundling palette, icons, design system…');
  await put('docs/forward-manifest.json', await text('game/assets/forward-manifest.json'));
  await put('game/assets/brand/README.md', await text('game/assets/brand/README.md'));
  for (const n of ['logo_mark.svg', 'logo_mark_mono.svg', 'logo_horizontal.svg', 'logo_horizontal_onbrass.svg', 'logo_stacked.svg']) await put('game/assets/brand/' + n, await text('game/assets/brand/' + n));
  for (const s of [16, 32, 48, 64, 128, 256, 512, 1024]) await put(`game/assets/brand/appicon_${s}.png`, await text(`game/assets/brand/appicon_${s}.png`));
  for (const [p, n] of [['game/assets/palette.json', 'docs/palette.json'], ['game/assets/palette.md', 'docs/PALETTE.md'], ['game/assets/towers/README.md', 'game/assets/structures/README-towers.md'], ['docs/ASSET-DELIVERY.md', 'docs/ASSET-DELIVERY.md']])
    await (n === 'docs/ASSET-DELIVERY.md' ? putDeliveryNote(p, n) : put(n, await text(p)));
  for (const i of ICONS) await put(`game/assets/ui/${i}.svg`, await text(`game/assets/ui/${i}.svg`));
  for (const t of ['base', 'colors', 'effects', 'fonts', 'spacing', 'typography']) await put(`docs/design-system/${t}.css`, await text(`ds/tokens/${t}.css`));
  // ui-screens.html imports ui-screens-v2.js since the 2026-09-12 drop; a viewer copied without it is a blank page.
  for (const f of ['ui-kit.css', 'ui-screens.js', 'ui-screens-v2.js', 'ui-branding.js', 'ui-weapon-view.js']) await put('docs/design-system/' + f, await text(f));
  await put('docs/design-system/ui-screens.html', new TextEncoder().encode((await (await fetch('Deep Field 3D - UI Screens.html')).text()).replaceAll('ds/tokens/', '')));
  }
  say(`DONE — ${done} GLB files exported`);
} catch (err) {
  say('ERROR export failed: ' + (err.stack || err.message));
}
</script>
</body>
</html>
