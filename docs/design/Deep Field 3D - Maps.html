<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "condition": "clear",
  "vantage": "overview",
  "dressing": "full"
}/*EDITMODE-END*/;
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => {
    const apply = () => window.__maps?.applyTweaks(t);
    apply(); window.addEventListener('maps-ready', apply);
    return () => window.removeEventListener('maps-ready', apply);
  }, [t]);
  return (
    <TweaksPanel title="Map tweaks">
      <TweakSection label="Wave condition" />
      <TweakSelect label="Weather" value={t.condition} options={['clear', 'fog', 'night', 'storm']} onChange={(v) => setTweak('condition', v)} />
      <TweakSection label="Read the map as" />
      <TweakRadio label="Vantage" value={t.vantage} options={['overview', 'hero', 'socket']} onChange={(v) => setTweak('vantage', v)} />
      <TweakRadio label="Dressing" value={t.dressing} options={['bare', 'sparse', 'full']} onChange={(v) => setTweak('dressing', v)} />
    </TweaksPanel>
  );
}
ReactDOM.createRoot(document.getElementById('tweaks-host')).render(<App />);
</script>
<script type="module">
import { makeEnemyKit } from './models/enemies.js';
import { FOUNDRY, makeFoundryMats } from './models/foundry.js';
import { SHARED } from './models/shared.js';
import { SWITCHYARD, makeSwitchyardMats } from './models/switchyard.js';
import { SPIRE, makeSpireMats } from './models/spire.js';
import { TOASTER, makeToasterMats, buildToasterBelt, buildToasterRoads, buildToasterDrive } from './models/toaster.js';
import { VEHICLES, makeVehicleMats } from './models/vehicles.js';
import { LEVELS, roadKeepOut } from './models/levels.js';
import { applyAtmosphere, clearAtmosphere } from './models/atmosphere.js';
import { triCount, countMeshes } from './models/tower-kit.js';
import { applyStudio } from './models/studio.js';

const el = (id) => document.getElementById(id);
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
applyStudio(stage, THREE, { intensity: .55 });
const K = makeEnemyKit(THREE); makeFoundryMats(THREE, K.mats); makeSwitchyardMats(THREE, K.mats); makeSpireMats(THREE, K.mats); makeToasterMats(THREE, K.mats); makeVehicleMats(THREE, K.mats);
K.mats.grip_rubber = K.mats.rubber; K.mats.threat = K.mats.weak;
const ALL = Object.fromEntries([...FOUNDRY, ...SWITCHYARD, ...SPIRE, ...TOASTER, ...VEHICLES, ...SHARED].map((m) => [m.id, m]));
const CATS = [
  { id: 'foundry', label: 'Foundry', groups: [['Assembly', [{ id: '__assembly_foundry', label: 'Full level', size: '110×80', swatch: '#ff8a1f', assembly: 'foundry' }]], ['Foundry kit', FOUNDRY], ['Shared kit', SHARED]] },
  { id: 'switchyard', label: 'Switchyard', groups: [['Assembly', [{ id: '__assembly_switchyard', label: 'Full level', size: '110×80', swatch: '#d8a13a', assembly: 'switchyard' }]], ['Switchyard kit', SWITCHYARD], ['Shared kit', SHARED]] },
  { id: 'spire', label: 'Spire', groups: [['Assembly', [{ id: '__assembly_spire', label: 'Full level', size: '40×40×40', swatch: '#ff4f7a', assembly: 'spire' }]], ['Spire kit', SPIRE], ['Shared kit', SHARED]] },
  { id: 'toaster', label: 'The Toaster', groups: [['Assembly', [{ id: '__assembly_toaster', label: 'Full level', size: '320×160', swatch: '#92844e', assembly: 'toaster' }]], ['Toaster kit', TOASTER], ['Vehicles', VEHICLES], ['Shared kit', SHARED]] },
];
let cat = CATS[0], cur = null, model = null, diag = {}, diagNote = '';
const view = (L) => L.view || { cam: [L.field[0] * .55, 38, L.field[1] * .9], target: [0, 2, 0] };
const tweaks = { condition: 'clear', vantage: 'overview', dressing: 'full' };
let condBase = null, stormRaf = 0;

el('tabs').innerHTML = CATS.map((c) => `<button type="button" data-cat="${c.id}">${c.label}</button>`).join('') +
  `<a href="Deep Field 3D - Asset Export.html"><span class="swatch" style="background:var(--arcane-400)"></span>Export pack</a><a href="Deep Field 3D - Roster.html"><span class="swatch" style="background:#e9614c"></span>Roster</a><a href="Deep Field 3D - Gunsmith.html"><span class="swatch" style="background:#c3ccd8"></span>Gunsmith</a><a href="Lance.html"><span class="swatch" style="background:#2b5cff"></span>Towers</a>`;

el('tabs').addEventListener('click', (e) => { const c = CATS.find((x) => x.id === e.target.dataset.cat); if (c) setCat(c); });
function setCat(c) {
  cat = c;
  for (const b of el('tabs').querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.cat === c.id));
  el('title').textContent = c.label; el('list-title').textContent = c.label + ' kit';
  renderList();
  select('__assembly_' + c.id);
}
function renderList() { el('items').innerHTML = cat.groups.map(([h, items]) => `<li class="head">${h}</li>` + items.map((it) => `<li><button type="button" data-id="${it.id}"><span class="swatch" style="background:${it.swatch}"></span>${it.label}<small>${it.size || ''}</small></button></li>`).join('')).join(''); }
el('items').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; select(b.dataset.id); });
for (const id of ['showRoutes', 'showSight', 'showDress', 'showSky', 'showAtmo', 'showVolumes']) el(id).addEventListener('change', () => cur?.assembly && select(cur.id));

function find(id) { for (const [, items] of cat.groups) { const it = items.find((x) => x.id === id); if (it) return it; } }
function select(id) {
  cur = find(id);
  for (const b of el('items').querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.id === id));
  clearAtmosphere(stage, THREE);
  model = cur.assembly ? buildAssembly(LEVELS[cur.assembly]) : cur.build(K);
  stage.setAttribute('name', cur.assembly ? cur.assembly + '_assembly' : cur.file.replace(/\.glb$/, ''));
  stage.setObject(model);
  if (cur.assembly) { // frame the playfield, not the 400 m sky dome
    const cam = stage._camera, ctl = stage._controls, L = LEVELS[cur.assembly], V = view(L);
    cam.near = .15; cam.far = 1500; cam.position.set(...V.cam); ctl.target.set(...V.target); cam.updateProjectionMatrix(); ctl.update();
    const span = 70; for (const k of ['left', 'right', 'top', 'bottom']) stage._key.shadow.camera[k] = (k === 'left' || k === 'bottom' ? -1 : 1) * span; stage._key.shadow.camera.updateProjectionMatrix();
    stage._ground.position.y = -.02;
  }
  if (cur.assembly && el('showAtmo').checked) { const L = LEVELS[cur.assembly]; applyAtmosphere(stage, THREE, L.kit, model, L.field[0], L.field[1]); }
  if (cur.assembly) { condBase = null; applyCondition(); applyVantage(); }
  el('assemblyChecks').hidden = !cur.assembly;
  el('info-title').textContent = cur.label;
  el('file').textContent = cur.assembly ? 'models/levels.js · sim/Sim.Core/Content/Maps.cs' : 'game/assets/' + cur.dir + cur.file;
  el('note').textContent = cur.note || (cur.assembly
    ? (diagNote || 'Authored to docs/MAP-AUTHORING.md: routes, sockets and anchors are sim truth, volumes and areas are design\u2019s. Cyan lines are socket→route sightlines — dressing must never cross them; every wall socket sits on a solid volume.')
    : 'Every kit piece instanced at its GameRoot.cs graybox coordinate.');
  const b = new THREE.Box3(); model.traverse((o) => { if (o.isMesh && !o.userData.gizmo && !o.name.startsWith('sky_')) b.expandByObject(o); }); const s = b.getSize(new THREE.Vector3());
  el('stats').innerHTML = Object.entries({ ...(cur.stats || {}), ...(cur.assembly ? diag : {}), Bounds: `${s.x.toFixed(1)}×${s.y.toFixed(1)}×${s.z.toFixed(1)}`, Tris: triCount(model).toLocaleString(), Parts: String(countMeshes(model)) })
    .map(([k, v]) => `<div><dt>${k}</dt><dd class="${k === 'Tris' || k === 'Parts' ? 'arcane' : ''}${['Stranded', 'Off-lane', 'Crowded', 'Perched', 'Uncovered', 'Headroom', 'Masts'].includes(k) && v !== '0' ? ' warn' : ''}">${v}</dd></div>`).join('');
}

function buildAssembly(L) {
  const g = new THREE.Group(); g.name = L.label + '_assembly';
  const [W, H] = L.field;
  /* Dressing and the perimeter street shade themselves and nothing else. */
  const noShadow = (o) => { o.traverse((c) => { if (c.isMesh) { c.castShadow = false; c.userData.noShadow = true; } }); return o; };
  /* Furniture the terrain grid brings with it, for the clearance check, and
     what had to be thinned out of it. */
  const tileProps = [], thinned = [];
  /* Distance to the nearest ground lane — wanted by the terrain thinning pass
     as well as by the §4 checks below, so it lives above both.

     A TELEPORT LEG is not a lane. The sim moves the wave from one pad to the
     other in a single tick, so nothing ever stands on the line between them —
     but treated as geometry it is a two-hundred-metre straight across the
     whole property, and every check that measures “distance to a lane” then
     measures distance to a line that does not exist. On the Toaster that one
     mistake put a house, a pond and the entire treeline “in the lane” and
     reported three samples of a phantom leg as uncovered. So a route is split
     at its teleport legs and every check sees the WALKED pieces only. */
  const splitRoute = (name, pts) => {
    const tl = new Set((L.teleportLegs && L.teleportLegs[name]) || []);
    const out = []; let run = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++) {
      if (tl.has(i)) { if (run.length > 1) out.push(run); run = [pts[i + 1]]; }
      else run.push(pts[i + 1]);
    }
    if (run.length > 1) out.push(run);
    return out;
  };
  const WALKED = Object.entries(L.routes).flatMap(([n, r]) => (n === 'air' ? [] : splitRoute(n, r).map((s) => [n, s])));
  const FLOWN = Object.entries(L.routes).flatMap(([n, r]) => (n === 'air' ? splitRoute(n, r).map((s) => [n, s]) : []));
  const lanes = WALKED.map(([, s]) => s);
  const laneDist = (p) => {
    const s = new THREE.Vector3(...p); let best = Infinity;
    for (const r of lanes) for (let i = 0; i < r.length - 1; i++) {
      const a = new THREE.Vector3(...r[i]), ab = new THREE.Vector3(...r[i + 1]).sub(a);
      const t = Math.max(0, Math.min(1, s.clone().sub(a).dot(ab) / ab.lengthSq()));
      best = Math.min(best, s.distanceTo(a.clone().addScaledVector(ab, t)));
    }
    return best;
  };
  // Terrain tiles.
  const kit = L.kit, TERRAIN = ALL[kit + '_terrain'], WALL = ALL[kit + '_wall_boundary'] || ALL[kit + '_retainingwall'], ROAD = ALL[kit + '_path_ground'];
  const nx = Math.ceil(W / 20), nz = Math.ceil(H / 20);
  for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++) { const t = TERRAIN.buildVariant ? TERRAIN.buildVariant(K, (i * 3 + j * 2 + (i * j)) % 4) : TERRAIN.build(K); t.position.set(-W / 2 + 10 + i * 20, 0, -H / 2 + 10 + j * 20); t.scale.set(Math.min(1, (W / 2 - (-W / 2 + i * 20)) / 20), 1, Math.min(1, (H / 2 - (-H / 2 + j * 20)) / 20)); t.position.x = -W / 2 + i * 20 + 10 * t.scale.x; t.position.z = -H / 2 + j * 20 + 10 * t.scale.z;
    // Every tile's furniture gets walked on every map — this used to sit inside
    // the indoor branch, so on the two maps without an `indoor` field the grid's
    // props were never looked at. Flush or standing is measured, not listed:
    // measured across all three kits, surface pieces run 0–0.27 m (ballast,
    // drains, grates, sleepers, manhole lids), weed tufts reach 0.36 and bike
    // hoops 0.43 — all stepped over — while a planter is 1.27 and a switch
    // stand 1.49. Half a metre is the line, and it needs no name blocklist to
    // fall out of date.
    for (const c of [...t.children]) {
      if (/(^|_)terrain_ground$/.test(c.name)) continue;
      const p = c.position.clone().multiply(t.scale).add(t.position);
      if (L.indoor && p.x >= L.indoor.x[0] - 2.5 && p.x <= L.indoor.x[1] + 2.5 && p.z >= L.indoor.z[0] - 2.5 && p.z <= L.indoor.z[1] + 2.5) { t.remove(c); continue; }
      const bb = new THREE.Box3().setFromObject(c);
      if (bb.max.y - Math.max(0, bb.min.y) < .5) continue;
      // Standing prop on a fixed grid: it cannot be nudged the way a placed one
      // can, so a tile that drops one on a build pad loses it — the HideNamed
      // treatment the game already gives these stands.
      if (L.sockets.some(([, q]) => Math.abs(q[1] - p.y) < 2 && Math.hypot(q[0] - p.x, q[2] - p.z) < 3) || laneDist([p.x, p.y, p.z]) < 3) { t.remove(c); thinned.push(c.name); continue; }
      tileProps.push([c.name, [p.x, 0, p.z]]);
    }
    g.add(t); }
  // Boundary walls — only where the kit ships one (the Spire's is a street
  // frontage, so its variants cycle: one piece laid thirty-eight times would
  // put the same shopfront on a lattice, the terrain tile's mistake at street
  // scale). The detailed face is authored on +Z and must look inward on all
  // four edges. Nothing at the field edge casts — the key light's shadow
  // camera only spans 70 m, so those casters were pure cost.
  if (WALL) {
    const wall = (i) => noShadow(WALL.buildVariant ? WALL.buildVariant(K, i % 4) : WALL.build(K));
    let i = 0;
    for (let x = -W / 2 + 5; x < W / 2; x += 10) for (const s of [-1, 1]) { const w = wall(i++ + (s > 0 ? 2 : 0)); w.position.set(x, 0, s * (H / 2 + .6)); w.rotation.y = s > 0 ? Math.PI : 0; g.add(w); }
    for (let z = -H / 2 + 5; z < H / 2; z += 10) for (const s of [-1, 1]) { const w = wall(i++ + (s > 0 ? 1 : 3)); w.position.set(s * (W / 2 + .6), 0, z); w.rotation.y = s > 0 ? -Math.PI / 2 : Math.PI / 2; g.add(w); }
  }
  // The made roads (Toaster): 4 m modules along the authored polylines, plus
  // the circular drive from twelve 30° arcs off one centre of curvature.
