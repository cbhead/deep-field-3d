name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast lane: no engine. Sim.Core compiles standalone (a Godot type leaking
  # into the sim is a build break here), unit tests run, then the harness gates.
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Sim.Core (standalone, enforces no-Godot boundary)
        run: dotnet build sim/Sim.Core --configuration Release
      - name: Unit tests
        run: dotnet test sim/Sim.Core.Tests --configuration Release
      - name: Harness gates
        run: dotnet run --project sim/Sim.Harness --configuration Release

  # Smoke lane: headless dedicated server + headless client join on loopback.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: false
      - name: Import + build
        run: |
          # --path X --import, not --import X: the latter silently no-ops on
          # 4.7 and every asset stays unimported.
          godot --headless --path game --import
          godot --headless --path game --build-solutions --quit || true
      - name: Server + client join smoke
        run: |
          godot --headless --path game -- --server --port 8791 > server.log 2>&1 &
          SERVER_PID=$!
          sleep 6
          godot --headless --path game --quit-after 900 -- --join 127.0.0.1:8791 > client.log 2>&1
          curl -s http://127.0.0.1:8791/info | tee info.json
          kill $SERVER_PID || true
          grep -q '"app":"deepfield-3d"' info.json
          grep -q "\[client\] joined seat" client.log

      # Builds one view of every enemy, tower, trap, upgrade stage, projectile
      # and hero, then checks that every asset name the code asks for is a name
      # the design brief actually gives design. Silent drift here means art
      # gets delivered and never loads.
      - name: Asset seam audit
        run: |
          godot --headless --path game -- --asset-audit > audit.log 2>&1
          grep -q "\[asset-audit\] built" audit.log
          ! grep -qiE "^ERROR|SCRIPT ERROR|Unhandled exception" audit.log
          ./tools/asset-report.sh --verify audit.log
          ./tools/asset-report.sh

      # Operability, not appearance. The gunsmith's attachment slots were inert
      # for weeks while rendering perfectly — no screenshot could catch it. This
      # pushes a real mouse event through hit-testing and fails if the selection
      # does not move.
      - name: UI probe (gunsmith is operable)
        run: |
          godot --headless --path game --quit-after 900 -- \
            --shot foundry /tmp/probe.png armory > probe.log 2>&1 || true
          grep -q "\[probe\] gunsmith Buy click works" probe.log
          ! grep -qiE "^ERROR|SCRIPT ERROR" probe.log

      # Turrets tracked correctly and pointed the wrong way for a whole
      # milestone, because "it swings to follow" reads as working. This
      # measures the angle rather than trusting a screenshot. The verdict goes
      # to a file: Godot buffers stdout and mono's headless teardown aborts
      # before it flushes, so prints from a run like this are routinely lost.
      - name: Aim probe (turrets face what they shoot)
        run: |
          godot --headless --path game --quit-after 7200 -- \
            --shot foundry /tmp/aim.txt aim > aim.log 2>&1 || true
          tail -5 /tmp/aim.txt
          grep -q "^PASS" /tmp/aim.txt

      # No ordinary run reaches this: solo builds nothing, so nothing has a
      # structure for a Ram to demolish, and the first version of the health
      # bar shipped without any client having ever destroyed a tower. This
      # builds a barricade, walks a Ram into it, and checks the two halves a
      # player depends on — that the damage was visible while it happened, and
      # that the wreck left the map when it finished.
      - name: Siege probe (a demolition is visible, and the wreck leaves)
        run: |
          godot --headless --path game --quit-after 14400 -- \
            --shot switchyard /tmp/siege.txt siege > siege.log 2>&1 || true
          tail -4 /tmp/siege.txt
          grep -q "^PASS" /tmp/siege.txt

      # A ladder that stops against the underside of the deck it serves looks
      # completely correct in the map file and from every angle in game, and
      # takes a whole tier out of play — on Switchyard it took the air lane
      # with it, because those four catwalk sockets are the only ones that
      # cover the strand. Three maps had it; two are fixed. This climbs every
      # ladder and checks the player is left standing at the top.
      - name: Traversal probe (every climb lands on something)
        run: |
          for MAP in foundry switchyard toaster; do
            godot --headless --path game --quit-after 6000 -- \
              --shot $MAP /tmp/trav-$MAP.txt traversal > trav-$MAP.log 2>&1 || true
            cat /tmp/trav-$MAP.txt
            grep -q "^PASS" /tmp/trav-$MAP.txt
          done

      # Elevation, which the aim probe above cannot see: it builds a Lance,
      # which cannot target air at all, and flattens both vectors to the ground
      # plane before taking the angle — so a barrel aimed level at a Skiff
      # fifteen metres up scores a perfect zero.
      #
      # A ratchet, not a gate. Filament's manifest row capped its pitch at 48
      # degrees while a Skiff passing near-overhead sits at 74, so for a whole
      # milestone it beamed a target it was pointing 26 degrees below. Design
      # raised the ceiling to 78 in the 2026-09-12 drop (the ask was
      # docs/FORWARD-MANIFEST-reload.md, "Turret elevation") and the settled
      # error measured 10.2 the day it landed; this holds the line there.
      - name: Air tracking (turrets elevate onto what they shoot)
        run: |
          godot --headless --path game --quit-after 12000 -- \
            --shot foundry /tmp/aimair.txt aimair > aimair.log 2>&1 || true
          cat /tmp/aimair.txt | tail -4
          WORST=$(grep -o 'worst elevation error once settled: [0-9.]*' /tmp/aimair.txt | grep -o '[0-9.]*$')
          echo "worst elevation error: ${WORST:-none} (baseline 10.5)"
          test -n "$WORST"
          awk -v w="$WORST" 'BEGIN { exit (w <= 10.5) ? 0 : 1 }'
          grep -q "worst yaw error once settled: 0" /tmp/aimair.txt

      # The Spire has shipped teleport pads since M3 that were coloured boxes
      # you walk over — wrong asset name, the pad id on the wrong node, and no
      # code handling the area kind at all — and every review shot of that map
      # contained two of them. This stands on a pad, picks a destination, waits
      # the charge, and checks both that the player arrived and that the sim
      # was told they had.
      - name: Teleport probe (a pad network moves you, once)
        run: |
          for MAP in toaster spire; do
            godot --headless --path game --quit-after 6000 -- \
              --shot $MAP /tmp/tele-$MAP.txt teleport > tele-$MAP.log 2>&1 || true
            cat /tmp/tele-$MAP.txt
            grep -q "^PASS" /tmp/tele-$MAP.txt
          done

      # Five things a vehicle has to do and none of them photograph: take a
      # driver the sim agrees to seat, move, turn, be stopped by the edge of
      # the world, and let the driver out standing. It also checks each one
      # reaches the speed its handling table claims for the ground it is on,
      # which is the only thing that would notice the surface multipliers
      # quietly going missing.
      - name: Vehicle probe (every vehicle can be driven)
        run: |
          godot --headless --path game --quit-after 9000 -- \
            --shot toaster /tmp/veh.txt vehicle > veh.log 2>&1 || true
          cat /tmp/veh.txt
          grep -q "^PASS" /tmp/veh.txt

      # The reload is code moving named nodes that design delivered as static
      # parts — a magazine with its pivot on the seated face, one posed
      # off-hand per beat, an action that carries its own travel. A node that
      # is missing skips its step by design, which is the one failure a
      # screenshot cannot see: the reload "plays" and nothing on screen moves.
      # This equips each platform, reloads it at the sim's own duration, and
      # checks the magazine-in beat and the clean-up.
      - name: Reload probe (every platform reloads with its own parts)
        run: |
          godot --headless --path game --quit-after 9000 -- \
            --shot foundry /tmp/reload.txt reload > reload.log 2>&1 || true
          cat /tmp/reload.txt
          grep -q "^PASS" /tmp/reload.txt

      # The rules in docs/MAP-AUTHORING.md §4, measured on the assembled map.
      # A ratchet rather than a gate: all three maps fail the rules today, each
      # carries a baseline, and this fails only when a map gets worse. The
      # coverage rules are the point — nothing else here checks whether a lane
      # can actually be defended, and a map can pass every other gate with an
      # enemy lane no tower can reach.
      - name: Map validation (no map may get worse)
        run: ./tools/map-validate.sh

      # Switchyard's yard is laid out in code from a handful of constants, and
      # the way it went wrong was never ugly — it was wrong. A running line
      # through four tower pads and a depot road four metres from the spawn
      # both photograph perfectly well as a railway. This measures every metre
      # of laid track against every socket, every walked route and every place
      # a player is put down.
      - name: Railway probe (no track through anything a player stands on)
        run: |
          godot --headless --path game --quit-after 6000 -- \
            --shot switchyard /tmp/rail.txt railway > rail.log 2>&1 || true
          cat /tmp/rail.txt
          grep -q "^PASS" /tmp/rail.txt

      # The review shots for these three photographed the wrong screen for a
      # whole milestone: a fresh match sits in intermission and that panel draws
      # over everything, and both the wheel and the upgrade panel are
      # hold-to-open, so opening them in code had them closed again on the next
      # frame. A png cannot fail a build, so each preset now writes down whether
      # the surface it is named for was actually open.
      - name: Surface shots open the surface they claim
        run: |
          for surface in wheel upgrade intermission; do
            godot --headless --path game --quit-after 7200 -- \
              --shot foundry /tmp/$surface.png $surface > $surface.log 2>&1 || true
            cat /tmp/$surface.png.txt
            # Both verdicts end in OPEN — match the whole line, or "NOT OPEN"
            # passes the check that exists to catch it.
            grep -qE "^[A-Z]+ OPEN$" /tmp/$surface.png.txt
          done

      # A real solo match on each map: drives the sim, every UI surface, and
      # the view/event plumbing that only runs once a world exists.
      - name: Solo match smoke (every sector)
        run: |
          for MAP in foundry switchyard spire toaster; do
            # Capture the exit code rather than letting -e kill the step: a
            # crash here printed nothing at all, which made a CI-only failure
            # impossible to diagnose from the run page.
            set +e
            godot --headless --path game --quit-after 1800 -- --solo $MAP --dump-assets > solo-$MAP.log 2>&1
            code=$?
            set -e
            if [ $code -ne 0 ]; then
              echo "=== $MAP exited $code ==="
              tail -80 "solo-$MAP.log"
              exit $code
            fi
            grep -q "\[solo\] started on $MAP" solo-$MAP.log
            # Map kits and traversal fixtures are only requested by a real
            # match, so this is the only place their names get checked against
            # the manifest. The content-table audit above cannot reach them.
            ./tools/asset-report.sh --verify "solo-$MAP.log"
            if grep -qiE "^ERROR|SCRIPT ERROR|Unhandled exception" solo-$MAP.log; then
              echo "=== $MAP reported errors ==="
              grep -iE "^ERROR|SCRIPT ERROR|Unhandled exception" -A 4 "solo-$MAP.log" | head -40
              exit 1
            fi
          done
